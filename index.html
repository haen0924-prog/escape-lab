<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>수어 연구소 탈출</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07060f; --panel:#12101f; --line:#2a2645; --cyan:#22e4ff; --red:#ff3355;
  --gold:#ffd23f; --green:#3dff8f; --text:#eeeeff; --sub:#9a97b8;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;
  background-image:radial-gradient(circle at 50% 0,#1b1640 0,transparent 60%)}
/* 화면 전체 스캔라인 효과 */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:90;
  background:repeating-linear-gradient(transparent 0 2px,rgba(255,255,255,.025) 2px 3px)}
/* 1분 남으면 빨간 경보 */
body.alarm::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:89;
  box-shadow:inset 0 0 120px rgba(255,30,60,.7);animation:alarm 1s infinite}
@keyframes alarm{50%{opacity:.2}}

.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.hide{display:none!important}
.bh{font-family:'Black Han Sans',sans-serif;font-weight:400}

/* ---------- 인트로 ---------- */
#intro{min-height:92vh;display:flex;flex-direction:column;justify-content:center;text-align:center}
.warn{display:inline-block;margin:0 auto 18px;padding:6px 14px;border:1px solid var(--red);color:var(--red);
  font-size:13px;letter-spacing:3px;animation:alarm 1.2s infinite}
.glitch{font-size:46px;line-height:1.15;position:relative;color:#fff;text-shadow:2px 0 var(--red),-2px 0 var(--cyan);
  animation:glitch 2.5s infinite}
@keyframes glitch{0%,90%,100%{transform:none}92%{transform:translate(-3px,1px) skewX(8deg)}94%{transform:translate(3px,-1px)}96%{transform:skewX(-6deg)}}
.glitch small{display:block;font-size:20px;color:var(--cyan);letter-spacing:6px;margin-bottom:6px;text-shadow:none}
.type{min-height:150px;margin:26px 0;font-size:15px;line-height:1.9;color:#cfd0ff;text-align:left;
  background:#0d0b1a;border:1px solid var(--line);border-radius:12px;padding:16px;font-family:monospace,'Noto Sans KR'}
.type::after{content:'▌';animation:alarm .8s infinite;color:var(--cyan)}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:17px;font-size:18px;font-family:'Black Han Sans';
  cursor:pointer;color:#06121a;background:var(--cyan);box-shadow:0 0 24px #22e4ff66;transition:.15s;letter-spacing:1px}
.btn:active{transform:scale(.96)}
.btn.red{background:var(--red);color:#fff;box-shadow:0 0 24px #ff335566}
.btn.gold{background:var(--gold);box-shadow:0 0 24px #ffd23f66}

/* ---------- 상단 HUD ---------- */
.hud{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  background:rgba(7,6,15,.9);backdrop-filter:blur(6px);padding:10px 0;margin-bottom:12px;border-bottom:1px solid var(--line)}
.locks{display:flex;gap:6px}
.lk{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:15px;opacity:.35}
.lk.on{opacity:1;border-color:var(--green);box-shadow:0 0 10px #3dff8f88}
.lk.now{opacity:1;border-color:var(--cyan);animation:alarm 1s infinite}
.clock{font-family:'Black Han Sans';font-size:30px;color:var(--cyan);text-shadow:0 0 12px var(--cyan);font-variant-numeric:tabular-nums}
.clock.danger{color:var(--red);text-shadow:0 0 12px var(--red)}
.mute{background:none;border:1px solid var(--line);color:var(--sub);border-radius:8px;width:34px;height:34px;font-size:16px;cursor:pointer}
.minus{position:fixed;top:56px;left:50%;transform:translateX(-50%);color:var(--red);font-family:'Black Han Sans';
  font-size:34px;z-index:95;pointer-events:none;animation:up 1.1s forwards;text-shadow:0 0 14px var(--red)}
@keyframes up{to{transform:translate(-50%,-50px);opacity:0}}

/* ---------- 스테이지 공통 ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;animation:in .5s}
@keyframes in{from{opacity:0;transform:scale(.95)}}
.stag{color:var(--cyan);font-size:13px;letter-spacing:4px}
.stitle{font-size:26px;margin:4px 0 8px}
.sdesc{color:var(--sub);font-size:14px;line-height:1.7;margin-bottom:16px}
.sdesc b{color:var(--gold)}
.hintbtn{margin-top:14px;width:100%;background:none;border:1px dashed var(--gold);color:var(--gold);border-radius:12px;
  padding:11px;font-size:14px;font-family:inherit;cursor:pointer}
.hinttxt{margin-top:10px;font-size:14px;color:#ffe9a6;line-height:1.6}
.msg{min-height:22px;text-align:center;margin-top:12px;font-weight:700;font-size:15px}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.flash-red{position:fixed;inset:0;background:var(--red);opacity:0;pointer-events:none;z-index:80;animation:fr .4s}
@keyframes fr{30%{opacity:.35}}

/* STAGE 1 : 손전등 */
.dark{position:relative;height:400px;border-radius:14px;overflow:hidden;touch-action:none;cursor:none;
  background:#3b2f25 repeating-linear-gradient(90deg,#3b2f25 0 46px,#352a21 46px 48px)}
.note{position:absolute;width:40%;padding:12px 10px;background:#f6ecc9;color:#2b2010;font-size:14px;font-weight:700;
  line-height:1.4;border:none;font-family:inherit;box-shadow:2px 4px 8px #0008;cursor:pointer;transition:.4s}
.note::before{content:'📌';position:absolute;top:-10px;left:50%;transform:translateX(-50%)}
.note.burn{filter:grayscale(1) brightness(.4);transform:scale(.8) rotate(20deg)!important;pointer-events:none}
.torch{position:absolute;inset:0;pointer-events:none;--x:50%;--y:50%;
  background:radial-gradient(circle at var(--x) var(--y),transparent 0,transparent 55px,rgba(3,2,10,.985) 100px);
  animation:flick 3s infinite}
@keyframes flick{0%,100%{opacity:1}47%{opacity:1}48%{opacity:.85}49%{opacity:1}}

/* STAGE 2 : 금고 키패드 */
.memo{background:#f6ecc9;color:#2b2010;border-radius:4px;padding:14px;font-size:14px;line-height:1.7;transform:rotate(-1.5deg);
  margin-bottom:16px;box-shadow:2px 4px 10px #0008}
.memo b{color:#b3261e}
.safe{background:linear-gradient(145deg,#2b2a35,#17161f);border:3px solid #4a4860;border-radius:18px;padding:16px;max-width:320px;margin:0 auto}
.screen{background:#021a10;color:var(--green);font-family:'Black Han Sans';font-size:34px;letter-spacing:14px;text-align:center;
  padding:10px;border-radius:8px;margin-bottom:12px;text-shadow:0 0 10px var(--green);min-height:62px}
.screen.no{background:#2a0208;color:var(--red);text-shadow:0 0 10px var(--red);letter-spacing:2px;font-size:24px;line-height:42px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{padding:14px 0;font-size:22px;font-family:'Black Han Sans';background:#2f2d3d;color:#fff;border:none;border-radius:10px;
  box-shadow:0 4px 0 #111;cursor:pointer}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #111}
.pad .ent{background:var(--green);color:#022}

/* STAGE 3 : 레이저 OX */
.laser{position:relative;border-radius:14px;padding:22px 16px;background:#0c0510;overflow:hidden;border:1px solid #4a1020}
.laser::before,.laser::after{content:'';position:absolute;left:-10%;width:120%;height:2px;background:var(--red);
  box-shadow:0 0 10px var(--red),0 0 20px var(--red);opacity:.7}
.laser::before{top:12px;animation:sweep 2.2s infinite alternate ease-in-out}
.laser::after{bottom:12px;animation:sweep 1.7s infinite alternate-reverse ease-in-out}
@keyframes sweep{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.prog{display:flex;justify-content:center;gap:8px;margin-bottom:16px}
.prog i{width:14px;height:14px;border-radius:50%;background:#33202a}
.prog i.on{background:var(--green);box-shadow:0 0 10px var(--green)}
.stmt{font-size:20px;font-weight:900;text-align:center;line-height:1.5;min-height:92px;display:flex;align-items:center;justify-content:center}
.bar{height:6px;background:#33202a;border-radius:3px;overflow:hidden;margin:14px 0}
.bar div{height:100%;width:100%;background:linear-gradient(90deg,var(--red),var(--gold))}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ox button{font-family:'Black Han Sans';font-size:44px;padding:10px 0;border-radius:14px;border:2px solid;background:transparent;cursor:pointer}
.ox .o{color:var(--cyan);border-color:var(--cyan)} .ox .x{color:var(--red);border-color:var(--red)}
.ox button:active{transform:scale(.94)}

/* STAGE 4 : 전선 연결 */
.wires{position:relative;display:flex;justify-content:space-between;gap:34px}
.wires svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.col{flex:1;display:flex;flex-direction:column;gap:10px;justify-content:space-around}
.term{position:relative;padding:12px 10px;font-size:13px;font-weight:700;line-height:1.4;border-radius:10px;border:2px solid var(--line);
  background:#1a1730;color:var(--text);font-family:inherit;cursor:pointer;text-align:center;transition:.2s;min-height:58px}
.term.sel{border-color:var(--gold);box-shadow:0 0 14px #ffd23f88}
.term.done{border-color:var(--green);opacity:.7;pointer-events:none}
.term.dead{border-color:var(--red);opacity:.3;pointer-events:none;text-decoration:line-through}
.term::after{content:'';position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--c,#555);transform:translateY(-50%)}
.col.l .term::after{right:-8px} .col.r .term::after{left:-8px}

/* ---------- 해제 연출 (이미지 공개) ---------- */
.ov{position:fixed;inset:0;z-index:60;background:rgba(3,2,10,.94);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.ov .box{max-width:440px;width:100%;text-align:center;animation:in .4s}
.unlock{font-size:30px;color:var(--green);text-shadow:0 0 16px var(--green)}
.imgbox{position:relative;width:min(260px,70vw);aspect-ratio:3/4;margin:16px auto;background:#fff;border-radius:14px;overflow:hidden;
  box-shadow:0 0 0 3px var(--green),0 0 40px #3dff8f66;animation:reveal 1.4s ease-out both}
@keyframes reveal{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
.imgbox img{width:100%;height:100%;object-fit:contain;display:block}
.imgbox::after{content:'';position:absolute;left:0;right:0;height:4px;background:var(--green);box-shadow:0 0 20px var(--green);
  animation:scan 1.4s ease-out both}
@keyframes scan{from{top:0}to{top:100%;opacity:0}}
.truth{background:#12101f;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;font-size:14px;line-height:1.7;margin-bottom:6px}
.truth b{color:var(--gold)}
.myth{color:var(--red);text-decoration:line-through;font-size:13px;margin-bottom:4px}

/* ---------- 엔딩 ---------- */
#fw{position:fixed;inset:0;pointer-events:none;z-index:70}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.piece{aspect-ratio:3/4;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 0 0 2px var(--gold),0 0 24px #ffd23f55;
  animation:fly 1s cubic-bezier(.2,1.4,.4,1) both;animation-delay:var(--d)}
.piece img{width:100%;height:100%;object-fit:contain}
@keyframes fly{from{transform:translate(var(--tx),var(--ty)) rotate(var(--r)) scale(.3);opacity:0}}
.final{font-size:24px;word-break:keep-all;color:var(--gold);text-align:center;text-shadow:0 0 14px #ffd23f88;line-height:1.4}
.rank{font-size:80px;text-align:center;color:var(--gold);text-shadow:0 0 30px var(--gold);animation:in 1s 1.6s both}
.stats{display:flex;justify-content:space-around;margin:10px 0 6px;color:var(--sub);font-size:13px;text-align:center}
.stats b{display:block;font-size:22px;color:var(--text);font-family:'Black Han Sans';font-weight:400}
</style>
</head>
<body>
<canvas id="fw"></canvas>
<div class="wrap">

  <!-- 인트로 -->
  <section id="intro">
    <div class="warn">⚠ SECURITY ALERT ⚠</div>
    <h1 class="glitch bh"><small>LAB · 0203</small>수어 연구소<br>탈출</h1>
    <div class="type" id="type"></div>
    <div class="hide" id="startBox">
      <input id="nick" maxlength="10" placeholder="요원 이름 (닉네임)" autocomplete="off"
        style="width:100%;padding:15px;border-radius:12px;border:2px solid var(--cyan);background:#0d0b1a;color:var(--text);font-size:18px;text-align:center;font-family:inherit;font-weight:700;margin-bottom:10px">
      <button class="btn red" id="startBtn" onclick="startGame()">▶ 탈출 작전 시작</button>
    </div>
  </section>

  <!-- 게임 -->
  <section id="game" class="hide">
    <div class="hud">
      <div class="locks" id="locks"></div>
      <div class="clock" id="clock">08:00</div>
      <button class="mute" id="muteBtn" onclick="toggleMute()">🔊</button>
    </div>
    <div id="stage"></div>
  </section>

  <!-- 엔딩 -->
  <section id="ending" class="hide" style="padding-top:20px">
    <h1 class="glitch bh" style="text-align:center"><small>ESCAPED</small>탈출 성공!</h1>
    <div class="grid" id="grid"></div>
    <div class="final bh" id="finalMsg"></div>
    <div class="rank bh" id="rank"></div>
    <div class="stats">
      <div>남은 시간<b id="sTime"></b></div>
      <div>실수<b id="sMiss"></b></div>
      <div>힌트<b id="sHint"></b></div>
    </div>
    <button class="btn gold" style="margin-top:16px" onclick="location.reload()">🔁 다시 도전</button>
  </section>
</div>

<!-- 해제 연출 -->
<div class="ov hide" id="reveal">
  <div class="box">
    <div class="unlock bh" id="rvTitle"></div>
    <div class="imgbox" id="rvImg"></div>
    <div class="truth" id="rvTruth"></div>
    <button class="btn" id="rvBtn" onclick="nextStage()" style="margin-top:12px"></button>
  </div>
</div>

<!-- 게임오버 -->
<div class="ov hide" id="over">
  <div class="box">
    <div style="font-size:70px">🚨</div>
    <h1 class="glitch bh" style="color:var(--red)">연구소 봉쇄</h1>
    <p style="color:var(--sub);margin:14px 0 20px;line-height:1.7">시간이 모두 지나 문이 완전히 잠겼습니다.<br>오해를 풀 기회는 아직 남아 있어요!</p>
    <button class="btn red" onclick="location.reload()">🔁 다시 도전</button>
  </div>
</div>

<script>
/* =========================================================
   ✏️ 바꾸고 싶으면 여기만 수정하세요
   ========================================================= */
const TIME_LIMIT  = 480;   // 제한시간 (초) → 480초 = 8분
const PENALTY     = 15;    // 틀리면 깎이는 시간 (초)
const HINT_COST   = 20;    // 힌트 쓰면 깎이는 시간 (초)
const FINAL_MESSAGE = '강원수어문화제';

let actx=null, muted=false;
function tone(f,d,type='sine',v=.15,w=0){
  if(muted||!actx) return;
  const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime+w;
  o.type=type; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t+d);
}

/* ---- 인트로 타자 효과 ---- */
const INTRO = [
  '> 시스템 경고: 수어 연구소 보안 시스템 오작동',
  '> 연구소 안에 "수어에 대한 오해"가 가득 퍼졌다.',
  '> 4개의 보안 잠금을 풀어 오해를 바로잡아라.',
  '> 제한 시간 8분. 틀리면 시간이 줄어든다.',
  '> 행운을 빈다, 요원.'
];
(function typeIntro(){
  const el=$('type'); let li=0, ci=0;
  const step=()=>{
    if(li>=INTRO.length){ $('startBox').classList.remove('hide'); return; }
    if(ci<=INTRO[li].length){ el.innerHTML=INTRO.slice(0,li).join('<br>')+(li?'<br>':'')+INTRO[li].slice(0,ci); ci++; setTimeout(step,32); }
    else { li++; ci=0; setTimeout(step,250); }
  };
  setTimeout(step,500);
})();

/* ---- 📊 구글 시트로 참여 기록 보내기 ---- */
let nick='', playId='';
function logSheet(status){
  if(!SHEET_URL) return;
  const data={ id:playId, nickname:nick, status, stage:stage, timeLeft:Math.max(0,timeLeft), misses, hints, device:/Mobi/i.test(navigator.userAgent)?'모바일':'PC' };
  try{ fetch(SHEET_URL,{ method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(data) }); }catch(e){}
}
$('nick').addEventListener('keydown',e=>{ if(e.key==='Enter') startGame(); });

function startGame(){
  if(!paused) return;
  nick = $('nick').value.trim() || ('요원' + Math.floor(100+Math.random()*900));
  playId = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  logSheet('시작');
  try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  sfx.ok();
  $('intro').classList.add('hide'); $('game').classList.remove('hide');
  paused=false;
  loop=setInterval(()=>{
    if(paused) return;
    timeLeft--; drawClock();
    if(timeLeft<=30 && timeLeft>0) sfx.tick();
    if(timeLeft<=0) gameOver();
  },1000);
  render();
}
function fmt(s){ s=Math.max(0,s); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function drawClock(){
  $('clock').textContent=fmt(timeLeft);
  const d=timeLeft<=60; $('clock').classList.toggle('danger',d); document.body.classList.toggle('alarm',d);
}
function drawLocks(){
  $('locks').innerHTML=STAGES.map((_,i)=>`<div class="lk ${i<stage?'on':i===stage?'now':''}">${i<stage?'🔓':'🔒'}</div>`).join('');
}

/* ---- 실수 / 힌트 ---- */
function penalty(sec,isMiss=true){
  timeLeft-=sec; if(isMiss) misses++; drawClock(); sfx.bad();
  const m=document.createElement('div'); m.className='minus'; m.textContent='-'+sec+'초';
  document.body.appendChild(m); setTimeout(()=>m.remove(),1100);
  const f=document.createElement('div'); f.className='flash-red'; document.body.appendChild(f); setTimeout(()=>f.remove(),400);
  const p=document.querySelector('.panel'); if(p){ p.classList.remove('shake'); void p.offsetWidth; p.classList.add('shake'); }
  if(timeLeft<=0) gameOver();
}
function useHint(){
  if(hintUsed) return;
  hintUsed=true; hints++; penalty(HINT_COST,false);
  $('hintTxt').innerHTML='💡 '+STAGES[stage].hint;
  $('hintBtn').classList.add('hide');
}
function say(t,c){ const m=$('msg'); m.textContent=t; m.style.color=c; }

/* ---- 단계 화면 그리기 ---- */
function render(){
  drawLocks(); hintUsed=false;
  const s=STAGES[stage];
  const head=`<div class="stag">STAGE ${stage+1} / 4</div><h2 class="stitle bh">${s.title}</h2>`;
  const foot=`<div class="msg" id="msg"></div>
    <button class="hintbtn" id="hintBtn" onclick="useHint()">💡 힌트 보기 (-${HINT_COST}초)</button>
    <div class="hinttxt" id="hintTxt"></div>`;
  $('stage').innerHTML=`<div class="panel">${head}<div id="body"></div>${foot}</div>`;
  [stage1,stage2,stage3,stage4][stage]();
  window.scrollTo(0,0);
}

/* STAGE 1 : 손전등으로 쪽지 찾기 */
function stage1(){
  const pos=shuffle([[6,8],[52,16],[10,58],[54,66]]);
  $('body').innerHTML=`<p class="sdesc">정전이다! 화면을 <b>문지르면</b> 손전등이 움직인다.<br>벽에 붙은 쪽지 중 오해가 아닌 <b>진실</b>을 찾아 눌러라.</p>
    <div class="dark" id="dark">
      ${NOTES.map((n,i)=>`<button class="note" data-ok="${n.ok}" style="left:${pos[i][0]}%;top:${pos[i][1]}%;transform:rotate(${(Math.random()*10-5).toFixed(1)}deg)">${n.t}</button>`).join('')}
      <div class="torch" id="torch"></div>
    </div>`;
  const dark=$('dark'), torch=$('torch');
  const move=e=>{ const r=dark.getBoundingClientRect();
    torch.style.setProperty('--x',(e.clientX-r.left)+'px'); torch.style.setProperty('--y',(e.clientY-r.top)+'px'); };
  dark.addEventListener('pointermove',move); dark.addEventListener('pointerdown',move);
  dark.querySelectorAll('.note').forEach(b=>b.onclick=()=>{
    if(b.dataset.ok==='true'){ torch.style.transition='opacity .6s'; torch.style.opacity=0; clearStage(); }
    else { b.classList.add('burn'); say('❌ 그건 오해다! 쪽지가 타버렸다','var(--red)'); penalty(PENALTY); }
  });
}

/* STAGE 2 : 금고 비밀번호 */
function stage2(){
  let code='';
  $('body').innerHTML=`<div class="memo">📜 찢어진 연구 노트<br>
    "한국수어가 한국어와 <b>동등한 언어</b>임을 기념하는 날,<br>그 날짜가 금고의 열쇠다." <br>💡 힌트: <b>한국수화언어법 제정 2016.2.3.</b></div>
    <div class="safe"><div class="screen" id="scr">____</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}
      <button data-k="del">⌫</button><button data-k="0">0</button><button data-k="ok" class="ent">OK</button></div></div>`;
  const scr=$('scr');
  const draw=()=>{ scr.className='screen'; scr.textContent=(code+'____').slice(0,4); };
  document.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>{
    sfx.key(); const k=b.dataset.k;
    if(k==='del') code=code.slice(0,-1);
    else if(k==='ok'){
      if(code===SAFE_CODE){ scr.textContent='OPEN'; clearStage(); return; }
      scr.className='screen no'; scr.textContent='ACCESS DENIED'; code=''; penalty(PENALTY);
      setTimeout(draw,900); return;
    }
    else if(code.length<4) code+=k;
    draw();
  });
}

/* STAGE 3 : 레이저 OX (연속 정답) */
function stage3(){
  $('body').innerHTML=`<p class="sdesc">레이저가 다가온다! <b>${OX_SEC}초 안에</b> O / X를 고르라.<br><b>${OX_COUNT}문제 연속</b>으로 맞혀야 보안망이 꺼진다. 틀리면 처음부터!</p>
    <div class="laser"><div class="prog" id="prog"></div><div class="stmt" id="stmt"></div>
    <div class="bar"><div id="bar"></div></div>
    <div class="ox"><button class="o" onclick="answerOX('O')">O</button><button class="x" onclick="answerOX('X')">X</button></div></div>`;
  startOX();
}
let oxList=[], oxIdx=0, oxLock=false;
function startOX(){ oxList=shuffle(OX).slice(0,OX_COUNT); oxIdx=0; askOX(); }
function askOX(){
  oxLock=false;
  $('prog').innerHTML=oxList.map((_,i)=>`<i class="${i<oxIdx?'on':''}"></i>`).join('');
  $('stmt').textContent=oxList[oxIdx].q;
  const bar=$('bar'); bar.style.transition='none'; bar.style.width='100%'; void bar.offsetWidth;
  bar.style.transition=`width ${OX_SEC}s linear`; bar.style.width='0%';
  clearTimeout(oxTimer); oxTimer=setTimeout(()=>answerOX(null),OX_SEC*1000);
}
function answerOX(a){
  if(oxLock||paused) return; oxLock=true; clearTimeout(oxTimer);
  const bar=$('bar'); bar.style.transition='none'; bar.style.width=getComputedStyle(bar).width;
  if(a===oxList[oxIdx].a){
    sfx.small(); oxIdx++; say('✔ 통과!','var(--green)');
    if(oxIdx>=OX_COUNT){ $('prog').innerHTML=oxList.map(()=>'<i class="on"></i>').join(''); clearStage(); }
    else setTimeout(askOX,500);
  } else {
    say(a===null?'⏰ 시간 초과! 처음부터 다시':`❌ 정답은 ${oxList[oxIdx].a}! 처음부터 다시`,'var(--red)');
    penalty(PENALTY); setTimeout(()=>{ if(!paused) startOX(); },1300);
  }
}

/* STAGE 4 : 전선 연결 */
function stage4(){
  const rights=shuffle([...WIRES.map(w=>w.r),TRAP].filter(Boolean));
  $('body').innerHTML=`<p class="sdesc">폭발 직전! 왼쪽 단자를 누르고, 알맞은 오른쪽 단자를 눌러 <b>5개의 전선</b>을 모두 연결하라.</p>
    <div class="wires" id="wires"><svg id="svg"></svg>
      <div class="col l">${WIRES.map((w,i)=>`<button class="term" data-i="${i}" style="--c:${w.c}">${w.l}</button>`).join('')}</div>
      <div class="col r">${rights.map(r=>`<button class="term" data-r="${r}">${r}</button>`).join('')}</div>
    </div>`;
  let sel=null, done=[];
  const L=[...document.querySelectorAll('.col.l .term')], R=[...document.querySelectorAll('.col.r .term')];
  L.forEach(b=>b.onclick=()=>{ sfx.key(); L.forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); sel=+b.dataset.i; say('',''); });
  R.forEach(b=>b.onclick=()=>{
    if(TRAP && b.dataset.r===TRAP){ b.classList.add('dead'); say('💥 함정! ‘벙어리’는 낮잡아 부르는 말이에요','var(--red)'); penalty(PENALTY); return; }
    if(sel===null){ say('먼저 왼쪽 단자를 고르세요','var(--gold)'); return; }
    if(WIRES[sel].r===b.dataset.r){
      sfx.small(); done.push([sel,b]); L[sel].classList.remove('sel'); L[sel].classList.add('done'); b.classList.add('done');
      b.style.setProperty('--c',WIRES[sel].c); sel=null; drawWires(); say('⚡ 연결 성공!','var(--green)');
      if(done.length===WIRES.length) clearStage();
    } else { say('⚡ 합선! 다른 단자를 찾아라','var(--red)'); penalty(PENALTY); }
  });
  function drawWires(){
    const box=$('wires').getBoundingClientRect();
    $('svg').innerHTML=done.map(([i,rb])=>{
      const a=L[i].getBoundingClientRect(), b=rb.getBoundingClientRect();
      const x1=a.right-box.left, y1=a.top+a.height/2-box.top, x2=b.left-box.left, y2=b.top+b.height/2-box.top, mx=(x1+x2)/2;
      return `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" stroke="${WIRES[i].c}" stroke-width="4" fill="none" style="filter:drop-shadow(0 0 6px ${WIRES[i].c})"/>`;
    }).join('');
  }
  window.onresize=drawWires;
}

/* ---- 단계 통과 → 이미지 공개 ---- */
function clearStage(){
  paused=true; clearTimeout(oxTimer); sfx.ok();
  say('🔓 보안 해제!','var(--green)');
  setTimeout(()=>{
    const s=STAGES[stage];
    $('rvTitle').textContent=`🔓 보안 ${stage+1}단계 해제`;
    $('rvImg').innerHTML=''; void $('rvImg').offsetWidth;
    const box=$('rvImg'); box.style.animation='none'; void box.offsetWidth; box.style.animation='';
    box.innerHTML=`<img src="${IMAGES[stage]}" alt="조각 ${stage+1}">`;
    $('rvTruth').innerHTML=`<div class="myth">오해: ${s.myth}</div>✅ ${s.truth}`;
    $('rvBtn').textContent= stage===3 ? '🚪 연구소 탈출하기!' : `다음 보안 구역으로 ▶`;
    $('reveal').classList.remove('hide');
  },800);
}
function nextStage(){
  $('reveal').classList.add('hide'); stage++;
  if(stage>=STAGES.length) return ending();
  paused=false; render();
}

/* ---- 게임오버 ---- */
function gameOver(){
  if($('over').classList.contains('hide')===false) return;
  paused=true; clearInterval(loop); clearTimeout(oxTimer); timeLeft=0; drawClock();
  sfx.bad(); $('over').classList.remove('hide');
  logSheet('시간초과');
}

/* ---- 엔딩 ---- */
function ending(){
  clearInterval(loop); document.body.classList.remove('alarm');
  $('game').classList.add('hide'); $('ending').classList.remove('hide'); window.scrollTo(0,0);
  const from=[['-120vw','-60vh','-40deg'],['120vw','-60vh','40deg'],['-120vw','60vh','30deg'],['120vw','60vh','-30deg']];
  $('grid').innerHTML=IMAGES.map((src,i)=>`<div class="piece" style="--tx:${from[i][0]};--ty:${from[i][1]};--r:${from[i][2]};--d:${i*.2}s"><img src="${src}" alt="조각 ${i+1}"></div>`).join('');
  $('finalMsg').textContent=FINAL_MESSAGE;
  const score=timeLeft-misses*10;
  $('rank').textContent= score>=300?'S':score>=200?'A':score>=100?'B':'C';
  $('sTime').textContent=fmt(timeLeft); $('sMiss').textContent=misses+'번'; $('sHint').textContent=hints+'개';
  sfx.win(); fireworks();
  logSheet('탈출성공');
}
function fireworks(){
  const c=$('fw'), x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  let parts=[], t=0;
  const boom=()=>{ const cx=Math.random()*c.width, cy=Math.random()*c.height*.5+40, hue=Math.random()*360;
    for(let i=0;i<60;i++){ const a=Math.random()*Math.PI*2, s=Math.random()*5+1;
      parts.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:70,h:hue}); } tone(200+Math.random()*200,.3,'triangle',.05); };
  (function draw(){
    t++; if(t%28===0 && t<300) boom();
    x.clearRect(0,0,c.width,c.height);
    parts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.06; p.vx*=.98; p.l--;
      x.fillStyle=`hsla(${p.h},100%,65%,${p.l/70})`; x.fillRect(p.x,p.y,3,3); });
    parts=parts.filter(p=>p.l>0);
    if(t<420 || parts.length) requestAnimationFrame(draw); else x.clearRect(0,0,c.width,c.height);
  })();
}
</script>
</body>
